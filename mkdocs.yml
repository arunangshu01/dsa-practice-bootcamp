site_name: DSA Practice Bootcamp
site_description: Data Structures and Algorithms practice in Python
site_url: https://arunangshu01.github.io/dsa-practice-bootcamp/
repo_url: https://github.com/arunangshu01/dsa-practice-bootcamp
edit_uri: blob/master/

theme:
  name: material
  palette:
    - scheme: slate
      toggle:
        icon: material/lightbulb-on
        name: Switch to Stark light mode
    - scheme: default
      toggle:
        icon: material/lightbulb-outline
        name: Switch to Jarvis dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - navigation.footer

extra_css:
  - stylesheets/ironman.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets

